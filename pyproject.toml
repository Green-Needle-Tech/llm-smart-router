[project]
name = "llm-smart-router"
version = "2.16.6"
description = "Session-pinned LLM smart router with OpenAI-compatible API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cachetools>=5.5.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "pendulum>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "FLY"]
ignore = [
    "BLE001",  # blind exception catch — intentional in guard/error paths
    "B023",    # loop variable binding in regex sub callbacks — safe in practice
    "B017",    # pytest.raises(Exception) — intentional in some tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "RUF015", "FLY002", "SIM117"]

# Single source of truth for application version.
# config/settings.json "version" field is the CONFIG SCHEMA version (separate).
[tool.llm-smart-router]
application_version = "2.16.6"
config_schema_version = 1
