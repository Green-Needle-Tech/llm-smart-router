name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --only-binary :all: ruff==0.6.9
      - run: ruff check app/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --only-binary :all: -e ".[dev]"
      - run: mypy app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --only-binary :all: -e ".[dev]"
      - run: pytest -x -q --tb=short
        env:
          OPENROUTER_API_KEY: test-key-not-real
          ROUTER_API_KEY: test-router-key

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --only-binary :all: bandit==1.7.10
      - run: bandit -r app/ -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-smart-router:ci .
      - name: Container smoke test
        run: |
          docker run --rm -d --name lsr-smoke \
            -e OPENROUTER_API_KEY=test-key \
            -e ROUTER_API_KEY=test-key \
            -p 18080:8080 \
            llm-smart-router:ci
          sleep 5
          curl -sf http://localhost:18080/healthz | grep -q '"status":"ok"'
          docker stop lsr-smoke
