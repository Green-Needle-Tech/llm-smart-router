<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App icon background (rounded square) -->
  <rect x="16" y="16" width="480" height="480" rx="88" ry="88" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Decorative orbit ring -->
  <ellipse cx="256" cy="256" rx="170" ry="170" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="8,10" opacity="0.35" />

  <!-- Inner decorative ring -->
  <ellipse cx="256" cy="256" rx="130" ry="130" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="5,8" opacity="0.25" />

  <!-- === Node 1: Top-left (Input / Source) === -->
  <circle cx="160" cy="160" r="32" fill="#e0e7ff" opacity="0.95" />
  <circle cx="160" cy="160" r="28" fill="#c7d2fe" />
  <g transform="translate(160, 160)">
    <!-- Sparkle dots inside node -->
    <circle cx="-8" cy="-6" r="3" fill="#4338ca" opacity="0.7" />
    <circle cx="8" cy="-4" r="2" fill="#4338ca" opacity="0.5" />
    <circle cx="-2" cy="8" r="2.5" fill="#4338ca" opacity="0.6" />
    <circle cx="10" cy="6" r="1.5" fill="#4338ca" opacity="0.4" />
  </g>

  <!-- === Node 2: Bottom-left (LLM A) === -->
  <circle cx="140" cy="340" r="30" fill="#ede9fe" opacity="0.9" />
  <circle cx="140" cy="340" r="26" fill="#ddd6fe" />
  <text x="140" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#5b21b6" opacity="0.8">A</text>

  <!-- === Node 3: Top-right (LLM B) === -->
  <circle cx="356" cy="148" r="30" fill="#ede9fe" opacity="0.9" />
  <circle cx="356" cy="148" r="26" fill="#ddd6fe" />
  <text x="356" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#5b21b6" opacity="0.8">B</text>

  <!-- === Node 4: Bottom-right (LLM C) === -->
  <circle cx="370" cy="340" r="30" fill="#ede9fe" opacity="0.9" />
  <circle cx="370" cy="340" r="26" fill="#ddd6fe" />
  <text x="370" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#5b21b6" opacity="0.8">C</text>

  <!-- === Central Hub (the Smart Router) === -->
  <circle cx="256" cy="256" r="52" fill="white" opacity="0.15" />
  <circle cx="256" cy="256" r="44" fill="white" opacity="0.25" />
  <circle cx="256" cy="256" r="36" fill="white" opacity="0.95" />
  <circle cx="256" cy="256" r="32" fill="white" />

  <!-- Router icon: central node connections -->
  <g stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <!-- From hub to Node 1 (Source) -->
    <path d="M 235 230 Q 200 195 175 178" fill="none" />
    <!-- From hub to Node 2 (LLM A) -->
    <path d="M 225 275 Q 195 305 163 330" fill="none" />
    <!-- From hub to Node 3 (LLM B) -->
    <path d="M 285 230 Q 315 195 340 170" fill="none" />
    <!-- From hub to Node 4 (LLM C) -->
    <path d="M 280 280 Q 315 310 355 333" fill="none" />
  </g>

  <!-- Directional arrows on paths -->
  <g fill="#4338ca" opacity="0.5">
    <!-- Arrow: Hub → B -->
    <polygon points="310,200 318,190 314,208" />
    <!-- Arrow: Hub → A -->
    <polygon points="212,312 204,322 206,308" />
    <!-- Arrow: Hub → C -->
    <polygon points="310,300 318,310 314,292" />
    <!-- Arrow: Source → Hub -->
    <polygon points="195,200 188,210 205,206" />
  </g>

  <!-- === Glowing signal dot on Hub === -->
  <circle cx="256" cy="256" r="10" fill="#4338ca" opacity="0.5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="6" fill="#4338ca" />

  <!-- Bridging path through from source to all LLMs -->
  <path d="M 160 160 Q 200 256 256 256 Q 320 256 356 148" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,6" />
  <path d="M 160 160 Q 200 256 256 256 Q 300 340 370 340" fill="none" stroke="white" stroke-width="1.5" opacity="0.15" stroke-dasharray="4,6" />
  <path d="M 160 160 Q 200 256 256 256 Q 190 340 140 340" fill="none" stroke="white" stroke-width="1.5" opacity="0.15" stroke-dasharray="4,6" />

  <!-- === Small data packet dots on the active path === -->
  <circle cx="196" cy="224" r="3.5" fill="white" opacity="0.7" />
  <circle cx="306" cy="226" r="3" fill="white" opacity="0.5" />
  <circle cx="224" cy="304" r="2.5" fill="white" opacity="0.4" />
  <circle cx="302" cy="300" r="2.5" fill="white" opacity="0.45" />

  <!-- === Text: LLM SMART ROUTER === -->
  <g transform="translate(256, 452)">
    <rect x="-120" y="-16" width="240" height="32" rx="16" fill="white" opacity="0.15" />
    <text x="0" y="4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="white" letter-spacing="2">LLM SMART ROUTER</text>
  </g>
</svg>