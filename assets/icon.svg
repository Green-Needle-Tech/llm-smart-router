<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Circular gradient: light teal to greenish-blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5ec2b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ab39a;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle glow for white elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop shadow for circle -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2d8a78" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Subtle inner highlight ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="white" stroke-width="1.5" opacity="0.15" />

  <!-- === Stylized "A" with wavy crossbar === -->
  <g filter="url(#glow)">
    <!-- Left stroke of A -->
    <path d="M 190 340 L 240 130 L 248 130 L 198 340 Z" fill="white" opacity="0.97" />
    <!-- Right stroke of A (slightly angled inward at top) -->
    <path d="M 322 340 L 272 130 L 264 130 L 314 340 Z" fill="white" opacity="0.97" />
    <!-- Wavy S-curve crossbar connecting the two strokes -->
    <path d="M 205 250 Q 230 235 256 250 Q 282 265 307 250"
          fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.97" />
  </g>

  <!-- === "LSR" text === -->
  <text x="256" y="382" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="42" fill="white" letter-spacing="6"
        filter="url(#glow)">LSR</text>

  <!-- === Three small icons at bottom: gear, cloud, share === -->
  <g transform="translate(0, 0)" fill="white" opacity="0.9">

    <!-- Gear icon (left) -->
    <g transform="translate(156, 430)">
      <!-- Gear teeth as rotated rectangles -->
      <g stroke="white" stroke-width="0">
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(45)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(90)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(135)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(180)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(225)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(270)"/>
        <rect x="-3" y="-14" width="6" height="8" rx="1" fill="white" transform="rotate(315)"/>
      </g>
      <!-- Gear body -->
      <circle cx="0" cy="0" r="9" fill="white"/>
      <circle cx="0" cy="0" r="4" fill="#5ec2b0"/>
    </g>

    <!-- Cloud icon (center) -->
    <g transform="translate(256, 430)">
      <!-- Cloud shape using circles + rounded rect -->
      <circle cx="-10" cy="2" r="7" fill="white"/>
      <circle cx="0" cy="-4" r="9" fill="white"/>
      <circle cx="10" cy="2" r="7" fill="white"/>
      <rect x="-16" y="2" width="32" height="8" rx="4" fill="white"/>
    </g>

    <!-- Share/forward arrow icon (right) -->
    <g transform="translate(356, 430)">
      <!-- Curved arrow pointing right -->
      <path d="M -12 0 Q -12 -12 0 -12 L 6 -12"
            fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Arrow head -->
      <polygon points="6,-16 12,-12 6,-8" fill="white"/>
      <!-- Second curve below -->
      <path d="M -12 0 Q -12 12 0 12 L 6 12"
            fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="6,8 12,12 6,16" fill="white"/>
      <!-- Connecting dot -->
      <circle cx="-12" cy="0" r="3" fill="white"/>
    </g>

  </g>
</svg>
